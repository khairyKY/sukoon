<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukoon · Invite</title>
<meta name="description" content="An invite to follow someone's glucose on Sukoon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2B26" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --ink: #1E2B26; --muted: #5E6B64; --line: #E4DFD4;
  --sage: #3E7A63; --deep: #2E5C4A; --mist: #CFE0D6;
  --serif: 'Newsreader', Georgia, serif; --sans: 'Hanken Grotesk', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1E2B26; --surface: #10201B; --ink: #E4DFD4; --muted: #A6B1AA; --line: rgba(228,223,212,.14); --sage: #82BBA0; --deep: #A8D3BE; --mist: rgba(130,187,160,.18); }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
main { max-width: 440px; margin: 0 auto; }
.mark { width: 56px; height: 56px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin: 14px 0 6px; }
p { line-height: 1.45; }
.muted { color: var(--muted); font-size: 15px; }
.code { font: 600 30px/1 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .06em; text-align: center; padding: 22px 0; margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.primary, .secondary { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin-top: 14px; border-radius: 14px; font: 600 16px var(--sans); text-decoration: none; }
.primary { background: var(--sage); color: #fff; }
.secondary { border: 1.5px solid var(--sage); color: var(--deep); }
.small { font-size: 13px; color: var(--muted); margin-top: 18px; }
a.link { color: var(--deep); }
.hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="30" fill="#1E2B26"/><circle cx="54" cy="54" r="19.13" fill="#EAF0EC"/><circle cx="63.56" cy="46.35" r="19.13" fill="#1E2B26"/><circle cx="60.69" cy="55.91" r="4.78" fill="none" stroke="#82BBA0" stroke-width="2.3"/></svg>
  <h1 data-t="title"></h1>
  <p class="muted" data-t="body"></p>
  <div class="code" id="code" aria-live="polite"></div>
  <a class="primary" id="openApp" href="#" data-t="openApp"></a>
  <a class="secondary" id="openWeb" href="#" data-t="openWeb"></a>
  <p class="small"><span data-t="noApp"></span> <a class="link" href="https://github.com/khairyKY/sukoon/releases/latest" data-t="getApp"></a></p>
  <p class="small hidden" id="bad" data-t="bad"></p>
</main>
<script>
'use strict';
// An invite link (join.html?c=ABCDEFGH). On Android: Sukoon opens with the code filled in, or, without
// the app, Chrome falls back to the follow page. Anywhere else: straight to the follow page with it.
const T = {
  en: {
    title: "You're invited to follow on Sukoon", body: "Someone shared their glucose with you. Follow it live in the Sukoon app, or in this browser.",
    openApp: 'Open in Sukoon', openWeb: 'Follow in the browser instead', noApp: "Don't have Sukoon?", getApp: 'Get it for Android',
    bad: "This link has no code in it. Ask them to send it again.",
  },
  ar: {
    title: 'اتعزمت تتابع على سكون', body: 'حد شاركك السكر بتاعه. تابعه مباشرة في تطبيق سكون، أو في المتصفح ده.',
    openApp: 'افتح في سكون', openWeb: 'تابع في المتصفح بدل كده', noApp: 'معندكش سكون؟', getApp: 'نزّله للأندرويد',
    bad: 'اللينك ده مفيهوش كود. اطلب منهم يبعتوه تاني.',
  },
};
const lang = (localStorage.getItem('lang') || navigator.language || 'en').startsWith('ar') ? 'ar' : 'en';
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });

const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().split('').filter((c) => ALPHABET.includes(c)).join('').slice(0, 8);
const web = 'index.html?code=' + code;
if (code.length !== 8) {
  document.getElementById('code').classList.add('hidden');
  document.getElementById('openApp').classList.add('hidden');
  document.getElementById('openWeb').classList.add('hidden');
  document.getElementById('bad').classList.remove('hidden');
} else if (!/Android/i.test(navigator.userAgent)) {
  location.replace(web); // no Android app to open: the follow page, with the code
} else {
  document.getElementById('code').textContent = code.slice(0, 4) + '-' + code.slice(4);
  const fallback = new URL(web, location.href).href;
  document.getElementById('openApp').href = `intent://follow?c=${code}#Intent;scheme=sukoon;S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
  document.getElementById('openWeb').href = web;
}
</script>
</body>
</html>
